# Syncs the ExternalSecret that pulls Grafana Cloud credentials from AWS Secrets Manager.
# Wave 0 so the Secret exists before the Alloy collectors (wave 1) start.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: cloudcart
  source:
    repoURL: https://github.com/mohitbnt/cloudcart-eks.git
    targetRevision: main
    path: kubernetes/monitoring/secrets
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
