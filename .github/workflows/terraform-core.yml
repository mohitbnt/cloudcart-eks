name: Initial Core Infrastructure Bootstrap

on:
  workflow_dispatch:

permissions: 
  id-token: write
  contents: read

jobs:
  terraform-core-infra:
    runs-on: ubuntu-latest
    steps:
      - name: Assume the AWS role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.OIDC_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: github-actions-terraform-core-infra
          audience: sts.amazonaws.com
      
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false
      
      - name: Terraform Format
        id: fmt
        working-directory: ./terraform
        run: terraform fmt -check -recursive

      #  Bootstrap Core Infrastructure
      - name: Terraform generate terraform.tfvars
        id: tfvars
        working-directory: ./terraform/core-infra
        run: |
          cp terraform.tfvars.example terraform.tfvars

      - name: Terraform Init
        id: init
        working-directory: ./terraform/core-infra
        run: terraform init -input=false -backend-config=core-infra-backend.conf
      
      - name: Terraform Validate
        id: validate
        working-directory: ./terraform/core-infra
        run: terraform validate -no-color

      - name: Terraform Plan
        id: plan
        working-directory: ./terraform/core-infra
        run: terraform plan -input=false -out=core-infra.tfplan -var-file=terraform.tfvars -var="enable_nat_gateway=true"

      - name: Terraform Apply
        id: apply
        working-directory: ./terraform/core-infra
        run: terraform apply -input=false -auto-approve core-infra.tfplan

      # Remove Temporary NAT Gateway
      - name: Terraform plan - Remove NAT Gateway
        id: plan-nat-gateway-disabled
        working-directory: ./terraform/core-infra
        run: terraform plan -input=false -out=disable_natgateway.tfplan -var-file=terraform.tfvars -var="enable_nat_gateway=false"

      - name: Terraform Apply - Remove NAT Gateway
        id: apply-nat-gateway-disabled
        working-directory: ./terraform/core-infra
        run: terraform apply -input=false -auto-approve disable_natgateway.tfplan
