name: 03 - Development Data Stores Infrastructure

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Terraform Action"
        required: true
        default: "apply"
        type: choice
        options:
          - apply
          - destroy

permissions:
  id-token: write
  contents: read

jobs:
  terraform-dev-infra:
    name: Terraform Dev Data Stores (${{ inputs.action }})
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Assume the AWS role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.OIDC_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: github-actions-terraform-dev-infra
          audience: sts.amazonaws.com

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: Terraform Format
        id: fmt
        working-directory: ./terraform
        run: terraform fmt -check -recursive

      - name: Generate terraform.tfvars
        id: tfvars
        working-directory: ./terraform/environments/dev
        run: |
          if [ -f terraform.tfvars.example ]; then
            cp terraform.tfvars.example terraform.tfvars
          fi

      - name: Terraform Init
        id: init
        working-directory: ./terraform/environments/dev
        run: terraform init -input=false -backend-config=dev-backend.conf

      - name: Terraform Validate
        id: validate
        working-directory: ./terraform/environments/dev
        run: terraform validate -no-color

      - name: Terraform Plan
        id: plan
        working-directory: ./terraform/environments/dev
        run: |
          if [ "${{ inputs.action }}" = "destroy" ]; then
            terraform plan -destroy -input=false -out=dev-infra.tfplan -var-file=terraform.tfvars
          else
            terraform plan -input=false -out=dev-infra.tfplan -var-file=terraform.tfvars
          fi

      - name: Terraform Apply or Destroy
        id: apply
        working-directory: ./terraform/environments/dev
        run: terraform apply -input=false -auto-approve dev-infra.tfplan