name: Promote to Production

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  DEV_VALUES_FILE: kubernetes/helm-charts/cloudcart/values-dev.yaml
  PROD_VALUES_FILE: kubernetes/helm-charts/cloudcart/values-prod.yaml

jobs:
  promote:
    name: Copy dev imageTags to prod (PR)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Copy imageTags from dev to prod
        id: copy
        run: |
          set -euo pipefail

          # the imageTags: header plus the indented lines under it
          awk '/^imageTags:/{f=1; print; next} f && /^  /{print; next} f{exit}' "$DEV_VALUES_FILE" > "$RUNNER_TEMP/dev-tags.yaml"

          if ! grep -q '^  ' "$RUNNER_TEMP/dev-tags.yaml"; then
            echo "::error::No imageTags block found in $DEV_VALUES_FILE"; exit 1
          fi
          if grep -q ': ""' "$RUNNER_TEMP/dev-tags.yaml"; then
            echo "::error::Some services have no tag in dev yet. Run 'Build and Push Images' with build_all first."
            cat "$RUNNER_TEMP/dev-tags.yaml"; exit 1
          fi

          # replace the imageTags: block in prod, leave the rest of the file untouched
          awk -v blockfile="$RUNNER_TEMP/dev-tags.yaml" '
            BEGIN { while ((getline line < blockfile) > 0) block = block line "\n" }
            /^imageTags:/ { printf "%s", block; skip = 1; next }
            skip && /^  / { next }
            { skip = 0; print }
          ' "$PROD_VALUES_FILE" > "$RUNNER_TEMP/values-prod.new"
          cp "$RUNNER_TEMP/values-prod.new" "$PROD_VALUES_FILE"

          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "### Prod already matches dev. Nothing to promote." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat
          fi

      - name: Open pull request
        if: steps.copy.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BRANCH="promote/prod-${GITHUB_RUN_ID}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git commit -am "chore(prod): promote dev image tags to production"
          git push origin "$BRANCH"

          {
            echo "Copies the \`imageTags\` block from \`values-dev.yaml\` into \`values-prod.yaml\`."
            echo "Images are not rebuilt: prod gets exactly what is running in dev."
            echo ""
            echo '```diff'
            git diff -U0 HEAD~1 HEAD -- "$PROD_VALUES_FILE" | grep -E '^[+-] ' || true
            echo '```'
            echo ""
            echo "**After merging:** open ArgoCD, review the diff on \`cloudcart-prod\`, then click **Sync**."
          } > "$RUNNER_TEMP/pr-body.md"

          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "Promote to production: copy dev image tags" \
            --body-file "$RUNNER_TEMP/pr-body.md" | tee "$RUNNER_TEMP/pr-url.txt"
          { echo "### Promotion PR opened"; echo ""; cat "$RUNNER_TEMP/pr-url.txt"; } >> "$GITHUB_STEP_SUMMARY"