name: 06 - Promote to Production

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  DEV_VALUES_FILE: kubernetes/helm-charts/cloudcart/values-dev.yaml
  PROD_VALUES_FILE: kubernetes/helm-charts/cloudcart/values-prod.yaml

jobs:
  promote:
    name: Copy dev imageTags to prod (PR)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Copy imageTags from dev to prod
        id: copy
        run: |
          set -euo pipefail

          # prints the imageTags: header plus the indented lines under it
          tags_block() { awk '/^imageTags:/{f=1; print; next} f && /^  /{print; next} f{exit}' "$1"; }

          tags_block "$DEV_VALUES_FILE" > "$RUNNER_TEMP/dev-tags.yaml"

          if ! grep -q '^  ' "$RUNNER_TEMP/dev-tags.yaml"; then
            echo "::error::No imageTags block found in $DEV_VALUES_FILE"; exit 1
          fi
          if grep -q ': ""' "$RUNNER_TEMP/dev-tags.yaml"; then
            echo "::error::Some services have no tag in dev yet. Run 'Build and Push Images' with build_all first."
            cat "$RUNNER_TEMP/dev-tags.yaml"; exit 1
          fi

          # Edit ONLY the tag lines in prod's imageTags block, in place. sed leaves every other
          # byte of the file alone (including a missing newline at the end of the file).
          sed -n -E 's/^  ([A-Za-z0-9_-]+): (.*)$/\1 \2/p' "$RUNNER_TEMP/dev-tags.yaml" |
            while read -r svc tag; do
              sed -i -E "/^imageTags:/,/^[^[:space:]#]/ s|^(  ${svc}: ).*|\1${tag}|" "$PROD_VALUES_FILE"
            done

          # the two blocks must now be identical, otherwise prod is missing a service key
          if ! diff <(tags_block "$PROD_VALUES_FILE") "$RUNNER_TEMP/dev-tags.yaml" >/dev/null; then
            echo "::error::prod imageTags block does not match dev after copying (missing service key?)"
            diff <(tags_block "$PROD_VALUES_FILE") "$RUNNER_TEMP/dev-tags.yaml" || true
            exit 1
          fi

          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "### Prod already matches dev. Nothing to promote." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat
          fi

      - name: Open pull request
        if: steps.copy.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BRANCH="promote/prod-${GITHUB_RUN_ID}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git commit -am "chore(prod): promote dev image tags to production"
          git push origin "$BRANCH"

          {
            echo "Copies the \`imageTags\` block from \`values-dev.yaml\` into \`values-prod.yaml\`."
            echo "Images are not rebuilt: prod gets exactly what is running in dev."
            echo ""
            echo '```diff'
            git diff -U0 HEAD~1 HEAD -- "$PROD_VALUES_FILE" | grep -E '^[+-] ' || true
            echo '```'
            echo ""
            echo "**After merging:** open ArgoCD, review the diff on \`cloudcart-prod\`, then click **Sync**."
          } > "$RUNNER_TEMP/pr-body.md"

          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "Promote to production: copy dev image tags" \
            --body-file "$RUNNER_TEMP/pr-body.md" | tee "$RUNNER_TEMP/pr-url.txt"
          { echo "### Promotion PR opened"; echo ""; cat "$RUNNER_TEMP/pr-url.txt"; } >> "$GITHUB_STEP_SUMMARY"