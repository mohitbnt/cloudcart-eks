name: 01 - Initial Core Infrastructure Bootstrap

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Terraform Action"
        required: true
        default: "apply"
        type: choice
        options:
          - apply
          - destroy

permissions:
  id-token: write
  contents: read

jobs:
  infrastructure:
    name: Terraform Core Infrastructure
    runs-on: ubuntu-latest
    outputs:
      cluster_name: ${{ steps.tf_outputs.outputs.cluster_name }}
      vpc_id: ${{ steps.tf_outputs.outputs.vpc_id }}

    steps:
      - name: Assume the AWS role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.OIDC_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: github-actions-terraform-core-infra
          audience: sts.amazonaws.com

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: Terraform Format
        id: fmt
        working-directory: ./terraform
        run: terraform fmt -check -recursive

      - name: Generate terraform.tfvars
        id: tfvars
        working-directory: ./terraform/core-infra
        run: |
          cp terraform.tfvars.example terraform.tfvars

      - name: Terraform Init
        id: init
        working-directory: ./terraform/core-infra
        run: terraform init -input=false -backend-config=core-infra-backend.conf

      - name: Terraform Validate
        id: validate
        working-directory: ./terraform/core-infra
        run: terraform validate -no-color

      - name: Terraform Plan - Core Infrastructure
        id: plan
        working-directory: ./terraform/core-infra
        run: |
          if [ "${{ inputs.action }}" = "destroy" ]; then
            terraform plan -destroy \
              -input=false \
              -out=core-infra.tfplan \
              -var-file=terraform.tfvars \
              -var="eks_admins=[\"${{ vars.EKS_ADMIN_ARN }}\",\"${{ vars.OIDC_ROLE_ARN }}\"]"
          else
            terraform plan \
              -input=false \
              -out=core-infra.tfplan \
              -var-file=terraform.tfvars \
              -var="eks_admins=[\"${{ vars.EKS_ADMIN_ARN }}\",\"${{ vars.OIDC_ROLE_ARN }}\"]"
          fi

      - name: Terraform Apply or Destroy - Core Infrastructure
        id: apply
        working-directory: ./terraform/core-infra
        run: terraform apply -input=false -auto-approve core-infra.tfplan

      - name: Get EKS Cluster Outputs
        if: inputs.action == 'apply'
        id: tf_outputs
        working-directory: ./terraform/core-infra
        run: |
          CLUSTER_NAME=$(terraform output -raw cluster_name)
          VPC_ID=$(terraform output -raw vpc_id)

          echo "cluster_name=$CLUSTER_NAME" >> "$GITHUB_OUTPUT"
          echo "vpc_id=$VPC_ID" >> "$GITHUB_OUTPUT"

      - name: Publish outputs to the job summary
        if: inputs.action == 'apply'
        env:
          CLUSTER_NAME: ${{ steps.tf_outputs.outputs.cluster_name }}
          VPC_ID: ${{ steps.tf_outputs.outputs.vpc_id }}
        run: |
          {
            echo "### Core infrastructure applied"
            echo ""
            echo "| Output | Value |"
            echo "|---|---|"
            echo "| EKS cluster | \`${CLUSTER_NAME}\` |"
            echo "| VPC ID | \`${VPC_ID}\` |"
            echo ""
            echo "Next: run workflow **02 - EKS Prerequisites**."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Destroy summary
        if: inputs.action == 'destroy'
        run: |
          {
            echo "### Core infrastructure destroyed"
            echo ""
            echo "Remember the data stores (workflows 03 and 04) must be destroyed first."
          } >> "$GITHUB_STEP_SUMMARY"