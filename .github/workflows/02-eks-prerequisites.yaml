name: 02 - EKS Prerequisites & Addons Installation

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: eks-prerequisites # two runs must not fight over the cluster's endpoint config
  cancel-in-progress: false

jobs:
  bootstrap-cluster:
    name: Cluster Addons Bootstrap
    runs-on: ubuntu-latest
    outputs:
      cluster_name: ${{ steps.core.outputs.cluster_name }}
      access_changed: ${{ steps.access.outputs.access_changed }}
      original_cidrs: ${{ steps.access.outputs.original_cidrs }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assume the AWS role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.OIDC_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: github-actions-k8s-bootstrap
          audience: sts.amazonaws.com

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      # Single source of truth: read what workflow 01 created from the remote state
      - name: Read core infrastructure outputs
        id: core
        working-directory: ./terraform/core-infra
        run: |
          terraform init -input=false -backend-config=core-infra-backend.conf
          echo "cluster_name=$(terraform output -raw cluster_name)" >> "$GITHUB_OUTPUT"
          echo "vpc_id=$(terraform output -raw vpc_id)" >> "$GITHUB_OUTPUT"

      # --------------------------------------------------------------------------
      # Temporarily allow this runner on the EKS public API endpoint
      # --------------------------------------------------------------------------
      - name: Allow runner IP on the EKS endpoint
        id: access
        env:
          CLUSTER_NAME: ${{ steps.core.outputs.cluster_name }}
        run: |
          set -euo pipefail

          RUNNER_IP=$(curl -4 -fsS --max-time 10 https://checkip.amazonaws.com | tr -d '[:space:]')
          [[ "$RUNNER_IP" =~ ^([0-9]{1,3}\.){3}[0-9]{1,3}$ ]] || { echo "::error::Could not determine the runner IP (got '$RUNNER_IP')"; exit 1; }

          # current list, comma separated
          ORIGINAL=$(aws eks describe-cluster --name "$CLUSTER_NAME" \
            --query 'cluster.resourcesVpcConfig.publicAccessCidrs' --output text | tr '\t' ',')
          echo "Allowed CIDRs now: ${ORIGINAL}"

          if [[ ",${ORIGINAL}," == *",0.0.0.0/0,"* || ",${ORIGINAL}," == *",${RUNNER_IP}/32,"* ]]; then
            echo "Runner is already allowed, nothing to change."
            echo "access_changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Record the original list BEFORE changing anything, so the restore job still runs
          # even if the update or the wait below fails.
          {
            echo "access_changed=true"
            echo "original_cidrs=${ORIGINAL}"
          } >> "$GITHUB_OUTPUT"

          echo "Adding ${RUNNER_IP}/32 to ${CLUSTER_NAME}"
          UPDATE_ID=$(aws eks update-cluster-config --name "$CLUSTER_NAME" \
            --resources-vpc-config "publicAccessCidrs=${ORIGINAL},${RUNNER_IP}/32" \
            --query 'update.id' --output text)

          for i in $(seq 1 60); do
            STATUS=$(aws eks describe-update --name "$CLUSTER_NAME" --update-id "$UPDATE_ID" \
              --query 'update.status' --output text)
            echo "update ${UPDATE_ID}: ${STATUS}"
            case "$STATUS" in
              Successful) exit 0 ;;
              Failed|Cancelled) echo "::error::EKS endpoint update ${STATUS}"; exit 1 ;;
            esac
            sleep 15
          done
          echo "::error::Timed out waiting for the EKS endpoint update"; exit 1

      - name: Configure kubectl for EKS
        run: |
          aws eks update-kubeconfig \
            --name "${{ steps.core.outputs.cluster_name }}" \
            --region "${{ vars.AWS_REGION }}"

      # The new CIDR can take a few seconds to take effect, so retry
      - name: Verify EKS connectivity
        run: |
          for i in $(seq 1 12); do
            kubectl get nodes && exit 0
            echo "API not reachable yet (attempt ${i}/12), retrying in 10s"
            sleep 10
          done
          echo "::error::Cannot reach the EKS API endpoint"; exit 1

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.12.0

      # --------------------------------------------------------------------------
      # Install External Secrets Operator
      # --------------------------------------------------------------------------
      - name: Deploy External Secrets Operator
        run: |
          helm repo add external-secrets https://charts.external-secrets.io
          helm repo update
          helm upgrade --install external-secrets \
            external-secrets/external-secrets \
            --version 0.14.2 \
            --namespace external-secrets \
            --create-namespace \
            --set installCRDs=true

      - name: Wait for External Secrets Operator to be ready
        run: |
          kubectl wait --namespace external-secrets --for=condition=available deployment/external-secrets --timeout=180s
          kubectl wait --namespace external-secrets --for=condition=available deployment/external-secrets-webhook --timeout=180s
          kubectl wait --namespace external-secrets --for=condition=available deployment/external-secrets-cert-controller --timeout=180s

      # --------------------------------------------------------------------------
      # Install AWS Load Balancer Controller
      # --------------------------------------------------------------------------
      - name: Deploy AWS Load Balancer Controller
        run: |
          helm repo add aws-load-balancer-controller https://aws.github.io/eks-charts
          helm repo update
          helm upgrade --install aws-load-balancer-controller \
            aws-load-balancer-controller/aws-load-balancer-controller \
            --version 1.16.0 \
            --namespace kube-system \
            --set clusterName="${{ steps.core.outputs.cluster_name }}" \
            --set region="${{ vars.AWS_REGION }}" \
            --set vpcId="${{ steps.core.outputs.vpc_id }}" \
            --set enableShield=false \
            --set enableWaf=false \
            --set enableWafv2=false \
            --set serviceAccount.create=true \
            --set serviceAccount.name=aws-load-balancer-controller \
            --set replicaCount=2

      # --------------------------------------------------------------------------
      # Deploy External Secrets ClusterSecretStore Configuration
      # --------------------------------------------------------------------------
      - name: Deploy ESO Secret Store Configuration
        working-directory: ./kubernetes/addons
        run: kubectl apply -f ./eso-config/cluster-secret-store.yaml

      # --------------------------------------------------------------------------
      # Deploy ArgoCD
      # --------------------------------------------------------------------------
      - name: Deploy ArgoCD
        run: |
          helm repo add argo https://argoproj.github.io/argo-helm
          helm repo update
          helm upgrade --install argocd argo/argo-cd \
            --version 7.8.2 \
            --namespace argocd \
            --create-namespace \
            --set 'server.extraArgs={--insecure}'

      - name: Wait for ArgoCD to be ready
        run: |
          kubectl wait --namespace argocd --for=condition=available deployment/argocd-server --timeout=180s
          kubectl wait --namespace argocd --for=condition=available deployment/argocd-repo-server --timeout=180s

  # ----------------------------------------------------------------------------
  # Always put the endpoint allow-list back, even if job 1 failed or was cancelled.
  # Separate job = separate runner, so it survives a crashed or cancelled runner.
  # It only talks to the AWS API, not to the cluster, so its IP does not need access.
  # ----------------------------------------------------------------------------
  restore-endpoint-access:
    name: Restore EKS endpoint access list
    needs: bootstrap-cluster
    if: ${{ always() && needs.bootstrap-cluster.outputs.access_changed == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - name: Assume the AWS role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.OIDC_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: github-actions-k8s-restore
          audience: sts.amazonaws.com

      - name: Restore the original allowed CIDRs
        env:
          CLUSTER_NAME: ${{ needs.bootstrap-cluster.outputs.cluster_name }}
          ORIGINAL_CIDRS: ${{ needs.bootstrap-cluster.outputs.original_cidrs }}
        run: |
          set -euo pipefail

          if [[ -z "$ORIGINAL_CIDRS" ]]; then
            echo "::warning::Original CIDR list is unknown. Re-run workflow 01 (terraform apply) to restore it from code."
            exit 0
          fi

          CURRENT=$(aws eks describe-cluster --name "$CLUSTER_NAME" \
            --query 'cluster.resourcesVpcConfig.publicAccessCidrs' --output text | tr '\t' ',')

          if [[ "$(tr ',' '\n' <<<"$CURRENT" | sort)" == "$(tr ',' '\n' <<<"$ORIGINAL_CIDRS" | sort)" ]]; then
            echo "Allowed CIDRs already match the original list. Nothing to restore."
            exit 0
          fi

          echo "Restoring: ${CURRENT}  ->  ${ORIGINAL_CIDRS}"
          UPDATE_ID=$(aws eks update-cluster-config --name "$CLUSTER_NAME" \
            --resources-vpc-config "publicAccessCidrs=${ORIGINAL_CIDRS}" \
            --query 'update.id' --output text)

          for i in $(seq 1 60); do
            STATUS=$(aws eks describe-update --name "$CLUSTER_NAME" --update-id "$UPDATE_ID" \
              --query 'update.status' --output text)
            echo "update ${UPDATE_ID}: ${STATUS}"
            case "$STATUS" in
              Successful) echo "### EKS endpoint access restored to: \`${ORIGINAL_CIDRS}\`" >> "$GITHUB_STEP_SUMMARY"; exit 0 ;;
              Failed|Cancelled) echo "::error::Restore ${STATUS}. Re-run workflow 01 (terraform apply) to reset it."; exit 1 ;;
            esac
            sleep 15
          done
          echo "::error::Timed out restoring the endpoint access list"; exit 1