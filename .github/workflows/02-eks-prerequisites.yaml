name: 02 - EKS Prerequisites & Addons Installation

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  kubernetes-bootstrap:
    name: Cluster Addons Bootstrap
    runs-on: ubuntu-latest

    steps:
      - name: Assume the AWS role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.OIDC_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: github-actions-k8s-bootstrap
          audience: ://amazonaws.com

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      # Single source of truth: read what workflow 01 created from the remote state
      - name: Read core infrastructure outputs
        id: core
        working-directory: ./terraform/core-infra
        run: |
          terraform init -input=false -backend-config=core-infra-backend.conf
          echo "cluster_name=$(terraform output -raw cluster_name)" >> "$GITHUB_OUTPUT"
          echo "vpc_id=$(terraform output -raw vpc_id)" >> "$GITHUB_OUTPUT"

      # --------------------------------------------------------------------------
      # Dynamically Whitelist Runner IP at EKS Endpoint Layer
      # --------------------------------------------------------------------------
      - name: Get Runner IP & Whitelist in EKS Cluster Endpoint
        id: whitelist
        run: |
          RUNNER_IP=$(curl -4 ipconfig.io)
          echo "RUNNER_IP=${RUNNER_IP}" >> "$GITHUB_ENV"
          echo "Whitelisting IP: ${RUNNER_IP}/32 on EKS Cluster Endpoint: ${{ steps.core.outputs.cluster_name }}"
          
          # Update EKS cluster public access config to include the runner IP alongside any existing CIDRs
          aws eks update-cluster-config \
            --name "${{ steps.core.outputs.cluster_name }}" \
            --resources-vpc-config publicAccessCidrs="${RUNNER_IP}/32"
          
          # Wait until EKS Cluster update transitions from UPDATING to ACTIVE
          echo "Waiting for EKS cluster update to complete..."
          aws eks wait cluster-active --name "${{ steps.core.outputs.cluster_name }}"

      - name: Configure kubectl for EKS
        run: |
          aws eks update-kubeconfig \
            --name "${{ steps.core.outputs.cluster_name }}" \
            --region "${{ vars.AWS_REGION }}"

      - name: Verify EKS Connectivity
        run: kubectl get nodes

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.12.0

      # --------------------------------------------------------------------------
      # Install External Secrets Operator
      # --------------------------------------------------------------------------
      - name: Deploy External Secrets Operator
        run: |
          helm repo add external-secrets https://charts.external-secrets.io
          helm repo update
          helm upgrade --install external-secrets \
            external-secrets/external-secrets \
            --version 0.14.2 \
            --namespace external-secrets \
            --create-namespace \
            --set installCRDs=true

      - name: Wait for External Secrets Operator to be ready
        run: |
          kubectl wait --namespace external-secrets --for=condition=available deployment/external-secrets --timeout=180s
          kubectl wait --namespace external-secrets --for=condition=available deployment/external-secrets-webhook --timeout=180s
          kubectl wait --namespace external-secrets --for=condition=available deployment/external-secrets-cert-controller --timeout=180s

      # --------------------------------------------------------------------------
      # Install AWS Load Balancer Controller
      # --------------------------------------------------------------------------
      - name: Deploy AWS Load Balancer Controller
        run: |
          helm repo add aws-load-balancer-controller https://aws.github.io/eks-charts
          helm repo update
          helm upgrade --install aws-load-balancer-controller \
            aws-load-balancer-controller/aws-load-balancer-controller \
            --version 1.16.0 \
            --namespace kube-system \
            --set clusterName="${{ steps.core.outputs.cluster_name }}" \
            --set region="${{ vars.AWS_REGION }}" \
            --set vpcId="${{ steps.core.outputs.vpc_id }}" \
            --set enableShield=false \
            --set enableWaf=false \
            --set enableWafv2=false \
            --set serviceAccount.create=true \
            --set serviceAccount.name=aws-load-balancer-controller \
            --set replicaCount=2

      # --------------------------------------------------------------------------
      # Deploy External Secrets ClusterSecretStore Configuration
      # --------------------------------------------------------------------------
      - name: Deploy ESO Secret Store Configuration
        working-directory: ./kubernetes/addons
        run: kubectl apply -f ./eso-config/cluster-secret-store.yaml

      # --------------------------------------------------------------------------
      # Deploy ArgoCD
      # --------------------------------------------------------------------------
      - name: Deploy ArgoCD
        run: |
          helm repo add argo https://argoproj.github.io/argo-helm
          helm repo update
          helm upgrade --install argocd argo/argo-cd \
            --version 7.8.2 \
            --namespace argocd \
            --create-namespace \
            --set server.extraArgs={--insecure}

      - name: Wait for ArgoCD to be ready
        run: |
          kubectl wait --namespace argocd --for=condition=available deployment/argocd-server --timeout=180s
          kubectl wait --namespace argocd --for=condition=available deployment/argocd-repo-server --timeout=180s