name: Initial Core Infrastructure Bootstrap

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  infrastructure:
    # --------------------------------------------------------------------------
    # JOB 1: Cloud Provisioning (Terraform)
    # --------------------------------------------------------------------------
    name: Terraform Core Infrastructure
    runs-on: ubuntu-latest
    outputs:
      cluster_name: ${{ steps.tf_outputs.outputs.cluster_name }}
      vpc_id: ${{ steps.tf_outputs.outputs.vpc_id }}

    steps:
      - name: Assume the AWS role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.OIDC_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: github-actions-terraform-core-infra
          audience: sts.amazonaws.com

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: Terraform Format
        id: fmt
        working-directory: ./terraform
        run: terraform fmt -check -recursive

      - name: Generate terraform.tfvars
        id: tfvars
        working-directory: ./terraform/core-infra
        run: |
          cp terraform.tfvars.example terraform.tfvars

      - name: Terraform Init
        id: init
        working-directory: ./terraform/core-infra
        run: terraform init -input=false -backend-config=core-infra-backend.conf

      - name: Terraform Validate
        id: validate
        working-directory: ./terraform/core-infra
        run: terraform validate -no-color

      - name: Terraform Plan - Bootstrap Core Infrastructure
        id: plan
        working-directory: ./terraform/core-infra
        run: |
          terraform plan \
            -input=false \
            -out=core-infra.tfplan \
            -var-file=terraform.tfvars \
            -var="eks_admins=[\"${{ vars.EKS_ADMIN_ARN }}\",\"${{ vars.OIDC_ROLE_ARN }}\"]"

      - name: Terraform Apply - Bootstrap Core Infrastructure
        id: apply
        working-directory: ./terraform/core-infra
        run: terraform apply -input=false -auto-approve core-infra.tfplan

      - name: Get EKS Cluster Outputs
        id: tf_outputs
        working-directory: ./terraform/core-infra
        run: |
          CLUSTER_NAME=$(terraform output -raw cluster_name)
          VPC_ID=$(terraform output -raw vpc_id)

          echo "cluster_name=$CLUSTER_NAME" >> "$GITHUB_OUTPUT"
          echo "vpc_id=$VPC_ID" >> "$GITHUB_OUTPUT"

  # ==========================================================================
  # JOB 2: Cluster Configuration & Bootstrapping (Kubernetes & Helm)
  # ==========================================================================
  kubernetes-bootstrap:
    name: Cluster Addons Bootstrap
    runs-on: ubuntu-latest
    needs: infrastructure

    steps:
      - name: Assume the AWS role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.OIDC_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: github-actions-k8s-bootstrap
          audience: sts.amazonaws.com

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure kubectl for EKS
        run: |
          aws eks update-kubeconfig \
            --name "${{ needs.infrastructure.outputs.cluster_name }}" \
            --region "${{ vars.AWS_REGION }}"

      - name: Verify EKS Connectivity
        run: kubectl get nodes

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.12.0

      # --------------------------------------------------------------------------
      # Install External Secrets Operator
      # --------------------------------------------------------------------------
      - name: Deploy External Secrets Operator
        run: |
          helm repo add external-secrets https://charts.external-secrets.io
          helm repo update
          helm upgrade --install external-secrets \
            external-secrets/external-secrets \
            --version 0.14.2 \
            --namespace external-secrets \
            --create-namespace \
            --set installCRDs=true

      - name: Wait for External Secrets Operator to be ready
        run: |
          kubectl wait --namespace external-secrets --for=condition=available deployment/external-secrets --timeout=180s
          kubectl wait --namespace external-secrets --for=condition=available deployment/external-secrets-webhook --timeout=180s
          kubectl wait --namespace external-secrets --for=condition=available deployment/external-secrets-cert-controller --timeout=180s

      # --------------------------------------------------------------------------
      # Install AWS Load Balancer Controller
      # --------------------------------------------------------------------------
      - name: Deploy AWS Load Balancer Controller
        run: |
          helm repo add aws-load-balancer-controller https://aws.github.io/eks-charts
          helm repo update
          helm upgrade --install aws-load-balancer-controller \
            aws-load-balancer-controller/aws-load-balancer-controller \
            --version 1.16.0 \
            --namespace kube-system \
            --set clusterName="${{ needs.infrastructure.outputs.cluster_name }}" \
            --set region="${{ vars.AWS_REGION }}" \
            --set vpcId="${{ needs.infrastructure.outputs.vpc_id }}" \
            --set enableShield=false \
            --set enableWaf=false \
            --set enableWafv2=false \
            --set serviceAccount.create=true \
            --set serviceAccount.name=aws-load-balancer-controller \
            --set replicaCount=2

      # --------------------------------------------------------------------------
      # Deploy External Secrets ClusterSecretStore Configuration
      # --------------------------------------------------------------------------
      - name: Deploy ESO Secret Store Configuration
        working-directory: ./kubernetes/addons
        run: kubectl apply -f ./eso-config/cluster-secret-store.yaml

      # --------------------------------------------------------------------------
      # Deploy ArgoCD
      # --------------------------------------------------------------------------
      - name: Deploy ArgoCD
        run: |
          helm repo add argo https://argoproj.github.io/argo-helm
          helm repo update
          helm upgrade --install argocd argo/argo-cd \
            --version 7.8.2 \
            --namespace argocd \
            --create-namespace \
            --set server.extraArgs={--insecure}

      - name: Wait for ArgoCD to be ready
        run: |
          kubectl wait --namespace argocd --for=condition=available deployment/argocd-server --timeout=180s
          kubectl wait --namespace argocd --for=condition=available deployment/argocd-repo-server --timeout=180s