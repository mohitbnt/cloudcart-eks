name: Initial Core Infrastructure Bootstrap

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  terraform-core-infra:
    runs-on: ubuntu-latest

    steps:
      # --------------------------------------------------------------------------
      # AWS Authentication
      # --------------------------------------------------------------------------
      - name: Assume the AWS role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.OIDC_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: github-actions-terraform-core-infra
          audience: sts.amazonaws.com

      # --------------------------------------------------------------------------
      # Checkout Repository
      # --------------------------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # --------------------------------------------------------------------------
      # Terraform Setup
      # --------------------------------------------------------------------------
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      # --------------------------------------------------------------------------
      # Terraform Format
      # --------------------------------------------------------------------------
      - name: Terraform Format
        id: fmt
        working-directory: ./terraform
        run: terraform fmt -check -recursive

      # --------------------------------------------------------------------------
      # Generate Terraform Variables
      # --------------------------------------------------------------------------
      - name: Generate terraform.tfvars
        id: tfvars
        working-directory: ./terraform/core-infra
        run: |
          cp terraform.tfvars.example terraform.tfvars

      # --------------------------------------------------------------------------
      # Terraform Initialization
      # --------------------------------------------------------------------------
      - name: Terraform Init
        id: init
        working-directory: ./terraform/core-infra
        run: terraform init -input=false -backend-config=core-infra-backend.conf

      # --------------------------------------------------------------------------
      # Terraform Validation
      # --------------------------------------------------------------------------
      - name: Terraform Validate
        id: validate
        working-directory: ./terraform/core-infra
        run: terraform validate -no-color

      # --------------------------------------------------------------------------
      # Bootstrap Core Infrastructure with NAT Gateway
      # --------------------------------------------------------------------------
      - name: Terraform Plan - Bootstrap with NAT Gateway
        id: plan
        working-directory: ./terraform/core-infra
        env:
          TF_VAR_eks_admins: '["${{ vars.EKS_ADMIN_ARN }}", "${{ vars.OIDC_ROLE_ARN }}"]'
        run: |
          terraform plan \
            -input=false \
            -out=core-infra.tfplan \
            -var-file=terraform.tfvars \
            -var="enable_nat_gateway=true"

      - name: Terraform Apply - Bootstrap with NAT Gateway
        id: apply
        working-directory: ./terraform/core-infra
        run: terraform apply -input=false -auto-approve core-infra.tfplan

      # --------------------------------------------------------------------------
      # Retrieve EKS Outputs
      # --------------------------------------------------------------------------
      - name: Get EKS Cluster Outputs
        id: tf_outputs
        working-directory: ./terraform/core-infra
        run: |
          CLUSTER_NAME=$(terraform output -raw cluster_name)
          VPC_ID=$(terraform output -raw vpc_id)

          echo "cluster_name=$CLUSTER_NAME" >> "$GITHUB_OUTPUT"
          echo "vpc_id=$VPC_ID" >> "$GITHUB_OUTPUT"

      # --------------------------------------------------------------------------
      # Configure kubectl for EKS
      # --------------------------------------------------------------------------
      - name: Update Kubeconfig for EKS
        run: |
          aws eks update-kubeconfig \
            --name "${{ steps.tf_outputs.outputs.cluster_name }}" \
            --region "${{ vars.AWS_REGION }}"

      # --------------------------------------------------------------------------
      # Verify Kubernetes Connectivity
      # --------------------------------------------------------------------------
      - name: Verify EKS Connectivity
        run: |
          kubectl get nodes

      # --------------------------------------------------------------------------
      # Helm Setup
      # --------------------------------------------------------------------------
      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.12.0

      # --------------------------------------------------------------------------
      # Install External Secrets Operator
      # --------------------------------------------------------------------------
      - name: Deploy External Secrets Operator
        run: |
          helm repo add external-secrets https://charts.external-secrets.io
          helm repo update

          helm upgrade --install external-secrets \
            external-secrets/external-secrets \
            --version 0.14.2 \
            --namespace external-secrets \
            --create-namespace \
            --set installCRDs=true

      # --------------------------------------------------------------------------
      # Install AWS Load Balancer Controller
      # --------------------------------------------------------------------------
      - name: Deploy AWS Load Balancer Controller
        run: |
          helm repo add aws-load-balancer-controller https://aws.github.io/eks-charts
          helm repo update

          helm upgrade --install aws-load-balancer-controller \
            aws-load-balancer-controller/aws-load-balancer-controller \
            --version 1.16.0 \
            --namespace kube-system \
            --set clusterName="${{ steps.tf_outputs.outputs.cluster_name }}" \
            --set region="${{ vars.AWS_REGION }}" \
            --set vpcId="${{ steps.tf_outputs.outputs.vpc_id }}" \
            --set enableShield=false \
            --set enableWaf=false \
            --set enableWafv2=false \
            --set serviceAccount.create=true \
            --set serviceAccount.name=aws-load-balancer-controller \
            --set replicaCount=2

      # --------------------------------------------------------------------------
      # Deploy External Secrets ClusterSecretStore Configuration
      # --------------------------------------------------------------------------
      - name: Deploy ESO Secret Store Configuration
        working-directory: ./kubernetes/addons
        run: |
          kubectl apply -f ./eso-config/cluster-secret-store.yaml

      # --------------------------------------------------------------------------
      # Remove Temporary NAT Gateway
      # --------------------------------------------------------------------------
      - name: Terraform Plan - Remove Temporary NAT Gateway
        id: plan-nat-gateway-disabled
        working-directory: ./terraform/core-infra
        run: |
          terraform plan \
            -input=false \
            -out=disable_natgateway.tfplan \
            -var-file=terraform.tfvars \
            -var="enable_nat_gateway=false"

      - name: Terraform Apply - Remove Temporary NAT Gateway
        id: apply-nat-gateway-disabled
        working-directory: ./terraform/core-infra
        run: |
          terraform apply \
            -input=false \
            -auto-approve \
            disable_natgateway.tfplan