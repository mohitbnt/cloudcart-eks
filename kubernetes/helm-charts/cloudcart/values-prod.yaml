# Production overrides; combine with values.yaml when installing.
global:
  environment: production

# Managed by CI - one tag per service (see values.yaml)
imageTags:
  frontend: "sha-0cccff5"
  gateway: "sha-0cccff5"
  cart: "sha-0cccff5"
  catalog: "sha-0cccff5"
  identity: "sha-0cccff5"
  inventory: "sha-0cccff5"
  notification: "sha-0cccff5"
  order: "sha-0cccff5"
  payment: "sha-0cccff5"

externalSecrets:
  postgresql:
    awsSecretName: cloudcart/prod/db-secrets
  redis:
    awsSecretName: cloudcart/prod/redis-url

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

notification:
  replicaCount: 2

config:
  data:
    ENVIRONMENT: production
    SESSION_COOKIE_SECURE: "true"
    API_BASE: https://api.cloudsystemonline.com
    ALLOWED_ORIGINS: https://shop.cloudsystemonline.com

ingress:
  enabled: true
  className: alb
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/ssl-policy: ELBSecurityPolicy-TLS13-1-2-2021-06
    alb.ingress.kubernetes.io/healthcheck-protocol: HTTP
    alb.ingress.kubernetes.io/healthcheck-path: /health
    alb.ingress.kubernetes.io/healthcheck-port: traffic-port
    alb.ingress.kubernetes.io/success-codes: "200"
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:us-east-1:533317135122:certificate/5d4ad4b5-b2d0-4100-9a7b-3171b126278f
  rules:
    - host: shop.cloudsystemonline.com
      paths:
        - path: /
          pathType: Prefix
          service:
            name: cloudcart-frontend-service
            port: 80
    - host: api.cloudsystemonline.com
      paths:
        - path: /
          pathType: Prefix
          service:
            name: cloudcart-gateway-service
            port: 8000