global:
  imageRegistry: 533317135122.dkr.ecr.us-east-1.amazonaws.com

# -----------------------------------------------------------------------------
# Image tags are set PER SERVICE
# -----------------------------------------------------------------------------
imageTags: {}

# -----------------------------------------------------------------------------
# Pod hardening (applied to every Deployment)
# -----------------------------------------------------------------------------
serviceAccount:
  create: true
  name: cloudcart # shared by all pods; the API token is NOT mounted

# Backends run as `appuser` (UID 1000 in the python:3.12-slim images). The UID must be numeric
# here because Kubernetes cannot verify runAsNonRoot for a user given only by name.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true # writable scratch space is the /tmp emptyDir only
  capabilities:
    drop: ["ALL"]

podDisruptionBudget:
  enabled: true
  maxUnavailable: 1

# Per-namespace resource cap (enabled in values-dev.yaml)
resourceQuota:
  enabled: false
  hard: {}

# -----------------------------------------------------------------------------
# External Secrets Store
# -----------------------------------------------------------------------------
externalSecrets:
  clusterSecretStoreName: aws-secrets-backend

# ------------------------------------------------------------------------------
# Metrics (Grafana Alloy annotation autodiscovery)
# ------------------------------------------------------------------------------
metrics:
  enabled: true

# ------------------------------------------------------------------------------
# Network policies (enforced by the VPC CNI network policy agent)
# Default deny in the namespace + an explicit allow-list per service.
# ------------------------------------------------------------------------------
networkPolicy:
  enabled: true
  servicePort: 8000                  # port used for service-to-service calls
  # ALB subnets (public subnets in terraform/core-infra). ALB target-type "ip"
  # delivers traffic to pods from these addresses.
  albCidrs:
    - 10.0.1.0/24
    - 10.0.2.0/24
  # Isolated data subnets hosting RDS and ElastiCache (data_subnet_cidrs in
  # terraform/core-infra). Pods live in the private subnets, so these CIDRs match
  # only the datastores.
  datastoreCidrs:
    - 10.0.31.0/24
    - 10.0.32.0/24
  monitoring:
    enabled: true                    # allow Grafana Alloy to scrape /metrics
    namespace: monitoring
  # fromAlb: reachable from the load balancer   ingressFrom: pods allowed to call it
  # egressTo: services it calls   postgres/redis: datastore access   scrape: has /metrics
  services:
    frontend:
      port: 8080
      fromAlb: true
    gateway:
      port: 8000
      fromAlb: true
      scrape: true
      egressTo: [catalog, identity, cart, order, inventory, payment, notification]
    catalog:
      port: 8000
      ingressFrom: [gateway]
      scrape: true
      postgres: true
    identity:
      port: 8000
      ingressFrom: [gateway]
      scrape: true
      postgres: true
      redis: true
    cart:
      port: 8000
      ingressFrom: [gateway]
      scrape: true
      redis: true
    inventory:
      port: 8000
      ingressFrom: [gateway, order]
      scrape: true
      postgres: true
    order:
      port: 8000
      ingressFrom: [gateway]
      scrape: true
      postgres: true
      egressTo: [inventory, payment]
    payment:
      port: 8000
      ingressFrom: [gateway, order]
      scrape: true
      postgres: true
    notification:
      port: 8000
      ingressFrom: [gateway]
      scrape: true
      postgres: true

# ------------------------------------------------------------------------------
# Autoscaling
# ------------------------------------------------------------------------------
autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 4
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

# ------------------------------------------------------------------------------
# Cart Microservice
# ------------------------------------------------------------------------------
cart:
  enabled: true
  replicaCount: 1

  image:
    repository: cloudcart/cart
    pullPolicy: IfNotPresent
    tag: ""

  service:
    type: ClusterIP
    port: 8000
    targetPort: 8000
  
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  probes:
    healthPath: /health
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5

# ------------------------------------------------------------------------------
# Catalog Microservice
# ------------------------------------------------------------------------------
catalog:
  enabled: true
  replicaCount: 1

  image:
    repository: cloudcart/catalog
    pullPolicy: IfNotPresent
    tag: ""

  service:
    type: ClusterIP
    port: 8000
    targetPort: 8000
  
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  probes:
    healthPath: /health
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5

# ------------------------------------------------------------------------------
# Frontend Microservice
# ------------------------------------------------------------------------------
frontend:
  enabled: true
  replicaCount: 1

  image:
    repository: cloudcart/frontend
    pullPolicy: IfNotPresent
    tag: ""

  service:
    type: ClusterIP
    port: 80
    targetPort: 8080 # nginx-unprivileged listens on 8080 (non-root cannot bind port 80)

  # nginx-unprivileged runs as the `nginx` user, UID 101
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 101
    runAsGroup: 101
    seccompProfile:
      type: RuntimeDefault

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  probes:
    healthPath: /health
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5

