global:
  imageTag: "1.0.0"

# -----------------------------------------------------------------------------
# External Secrets Store
# -----------------------------------------------------------------------------
externalSecrets:
  clusterSecretStoreName: aws-secrets-backend

# ------------------------------------------------------------------------------
# Autoscaling
# ------------------------------------------------------------------------------
autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 4
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

# ------------------------------------------------------------------------------
# Cart Microservice
# ------------------------------------------------------------------------------
cart:
  enabled: true
  replicaCount: 1

  image:
    repository: ghcr.io/mohitbnt/cloudcart-cart
    pullPolicy: IfNotPresent
    tag: ""

  service:
    type: ClusterIP
    port: 8000
    targetPort: 8000
  
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  probes:
    healthPath: /health
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5

# ------------------------------------------------------------------------------
# Catalog Microservice
# ------------------------------------------------------------------------------
