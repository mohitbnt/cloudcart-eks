# ------------------------------------------------------------------------------
# ConfigMap
# ------------------------------------------------------------------------------
config:
  enabled: true
  data:
    CATALOG_URL: http://cloudcart-catalog-service:8000
    IDENTITY_URL: http://cloudcart-identity-service:8000
    CART_URL: http://cloudcart-cart-service:8000
    ORDER_URL: http://cloudcart-order-service:8000
    INVENTORY_URL: http://cloudcart-inventory-service:8000
    PAYMENT_URL: http://cloudcart-payment-service:8000
    NOTIFICATION_URL: http://cloudcart-notification-service:8000
    SESSION_TTL_SECONDS: "86400"
    SESSION_COOKIE_NAME: cloudcart_session
    SESSION_COOKIE_SECURE: "false"
    API_BASE: http://localhost:8000
    ALLOWED_ORIGINS: http://localhost:3000

# ------------------------------------------------------------------------------
# Ingress
# ------------------------------------------------------------------------------
ingress:
  enabled: false
  className: alb
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/ssl-policy: ELBSecurityPolicy-TLS13-1-2-2021-06
    alb.ingress.kubernetes.io/healthcheck-protocol: HTTP
    alb.ingress.kubernetes.io/healthcheck-path: /health
    alb.ingress.kubernetes.io/healthcheck-port: traffic-port
    alb.ingress.kubernetes.io/success-codes: "200"
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:us-east-1:533317135122:certificate/5d4ad4b5-b2d0-4100-9a7b-3171b126278f
  rules:
    - host: shop.cloudsystemonline.com
      paths:
        - path: /
          pathType: Prefix
          service:
            name: cloudcart-frontend-service
            port: 80
    - host: api.cloudsystemonline.com
      paths:
        - path: /
          pathType: Prefix
          service:
            name: cloudcart-gateway-service
            port: 8000