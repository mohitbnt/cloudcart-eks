apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: postgresql-secret-sync
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cloudcart.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.externalSecrets.clusterSecretStoreName }}
    kind: ClusterSecretStore
  target:
    name: postgresql-secret
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: {{ required "externalSecrets.postgresql.awsSecretName must be set in environment values" .Values.externalSecrets.postgresql.awsSecretName | quote }}