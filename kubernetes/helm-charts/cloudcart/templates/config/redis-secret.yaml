apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: redis-config-sync
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cloudcart.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.externalSecrets.clusterSecretStoreName }}
    kind: ClusterSecretStore
  target:
    name: redis-secret
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: {{ required "externalSecrets.redis.awsSecretName must be set in environment values" .Values.externalSecrets.redis.awsSecretName | quote }}