{{- if .Values.config.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudcart-configmap
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cloudcart.labels" . | nindent 4 }}
    app.kubernetes.io/name: cloudcart
    app.kubernetes.io/component: configmap
data:
  {{- range $key, $value := .Values.config.data }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}