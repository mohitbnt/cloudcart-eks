apiVersion: v1
kind: Service
metadata:
  name: cloudcart-notification-service
  labels:
    {{- include "cloudcart.labels" . | nindent 4 }}
    app.kubernetes.io/name: notification-service
    app.kubernetes.io/component: service
  namespace: {{ .Release.Namespace }}
spec:
  type: {{ .Values.notification.service.type }}
  ports:
    - port: {{ .Values.notification.service.port }}
      targetPort: {{ .Values.notification.service.targetPort }}
  selector:
    {{- include "cloudcart.selectorLabels" "notification" | nindent 4 }}
