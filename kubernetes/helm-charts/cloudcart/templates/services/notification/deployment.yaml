apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudcart-notification-deployment
  labels:
    {{- include "cloudcart.labels" . | nindent 4 }}
    app.kubernetes.io/name: notification-deployment
    app.kubernetes.io/component: backend
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.notification.replicaCount }}
  selector:
    matchLabels:
      {{- include "cloudcart.selectorLabels" "notification" | nindent 6 }}
  template:
    metadata:
      {{- if .Values.metrics.enabled }}
      annotations:
        {{- include "cloudcart.metricsAnnotations" . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "cloudcart.labels" . | nindent 8 }}
        {{- include "cloudcart.selectorLabels" "notification" | nindent 8 }}
        app.kubernetes.io/component: backend
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      topologySpreadConstraints:
        {{- include "cloudcart.topologySpread" "notification" | nindent 8 }}
      containers:
        - name: cloudcart-notification-container
          image: "{{ $.Values.global.imageRegistry }}/{{ .Values.notification.image.repository }}:{{ .Values.imageTags.notification | default .Values.notification.image.tag }}"
          imagePullPolicy: {{ .Values.notification.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.notification.service.targetPort }}
              protocol: TCP
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgresql-secret
                  key: database_url
          resources:
            {{- toYaml .Values.notification.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          startupProbe:
            httpGet:
              path: {{ .Values.notification.probes.healthPath }}
              port: {{ .Values.notification.service.targetPort }}
            initialDelaySeconds: {{ .Values.notification.probes.initialDelaySeconds }}
            periodSeconds: {{ .Values.notification.probes.periodSeconds }}
            timeoutSeconds: {{ .Values.notification.probes.timeoutSeconds }}
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: {{ .Values.notification.probes.healthPath }}
              port: {{ .Values.notification.service.targetPort }}
            periodSeconds: {{ .Values.notification.probes.periodSeconds }}
            timeoutSeconds: {{ .Values.notification.probes.timeoutSeconds }}
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: {{ .Values.notification.probes.healthPath }}
              port: {{ .Values.notification.service.targetPort }}
            periodSeconds: {{ .Values.notification.probes.periodSeconds }}
            timeoutSeconds: {{ .Values.notification.probes.timeoutSeconds }}
            failureThreshold: 3
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
