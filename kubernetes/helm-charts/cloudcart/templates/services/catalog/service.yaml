apiVersion: v1
kind: Service
metadata:
  name: cloudcart-catalog-service
  labels:
    {{- include "cloudcart.labels" . | nindent 4 }}
    app.kubernetes.io/name: catalog-service
    app.kubernetes.io/component: service
  namespace: {{ .Release.Namespace }}
spec:
  type: {{ .Values.catalog.service.type }}
  ports:
    - port: {{ .Values.catalog.service.port }}
      targetPort: {{ .Values.catalog.service.targetPort }}
  selector:
    {{- include "cloudcart.selectorLabels" "catalog" | nindent 4 }}