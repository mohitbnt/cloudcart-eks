apiVersion: v1
kind: Service
metadata:
  name: cloudcart-cart-service
  labels:
    {{- include "cloudcart.labels" . | nindent 4 }}
    app.kubernetes.io/name: cart-service
    app.kubernetes.io/component: service
  namespace: {{ .Release.Namespace }}
spec:
  type: {{ .Values.cart.service.type }}
  ports:
    - port: {{ .Values.cart.service.port }}
      targetPort: {{ .Values.cart.service.targetPort }}
  selector:
    {{- include "cloudcart.selectorLabels" "cart" | nindent 4 }}