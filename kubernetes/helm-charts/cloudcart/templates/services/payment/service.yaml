apiVersion: v1
kind: Service
metadata:
  name: cloudcart-payment-service
  labels:
    {{- include "cloudcart.labels" . | nindent 4 }}
    app.kubernetes.io/name: payment-service
    app.kubernetes.io/component: service
  namespace: {{ .Release.Namespace }}
spec:
  type: {{ .Values.payment.service.type }}
  ports:
    - port: {{ .Values.payment.service.port }}
      targetPort: {{ .Values.payment.service.targetPort }}
  selector:
    {{- include "cloudcart.selectorLabels" "payment" | nindent 4 }}
