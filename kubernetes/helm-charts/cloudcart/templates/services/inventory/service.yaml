apiVersion: v1
kind: Service
metadata:
  name: cloudcart-inventory-service
  labels:
    {{- include "cloudcart.labels" . | nindent 4 }}
    app.kubernetes.io/name: inventory-service
    app.kubernetes.io/component: service
  namespace: {{ .Release.Namespace }}
spec:
  type: {{ .Values.inventory.service.type }}
  ports:
    - port: {{ .Values.inventory.service.port }}
      targetPort: {{ .Values.inventory.service.targetPort }}
  selector:
    {{- include "cloudcart.selectorLabels" "inventory" | nindent 4 }}
