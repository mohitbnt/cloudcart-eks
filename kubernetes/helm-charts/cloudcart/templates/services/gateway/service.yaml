apiVersion: v1
kind: Service
metadata:
  name: cloudcart-gateway-service
  labels:
    {{- include "cloudcart.labels" . | nindent 4 }}
    app.kubernetes.io/name: gateway-service
    app.kubernetes.io/component: service
  namespace: {{ .Release.Namespace }}
spec:
  type: {{ .Values.gateway.service.type }}
  ports:
    - port: {{ .Values.gateway.service.port }}
      targetPort: {{ .Values.gateway.service.targetPort }}
  selector:
    {{- include "cloudcart.selectorLabels" "gateway" | nindent 4 }}
