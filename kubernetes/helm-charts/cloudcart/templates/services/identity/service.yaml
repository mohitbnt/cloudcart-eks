apiVersion: v1
kind: Service
metadata:
  name: cloudcart-identity-service
  labels:
    {{- include "cloudcart.labels" . | nindent 4 }}
    app.kubernetes.io/name: identity-service
    app.kubernetes.io/component: service
  namespace: {{ .Release.Namespace }}
spec:
  type: {{ .Values.identity.service.type }}
  ports:
    - port: {{ .Values.identity.service.port }}
      targetPort: {{ .Values.identity.service.targetPort }}
  selector:
    {{- include "cloudcart.selectorLabels" "identity" | nindent 4 }}
