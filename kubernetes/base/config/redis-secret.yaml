apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: redis-config-sync
  namespace: cloudcart
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-backend
    kind: ClusterSecretStore
  target:
    name: redis-secret
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: cloudcart/prod/redis-url