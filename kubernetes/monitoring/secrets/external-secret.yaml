# AWS Secrets Manager secret (JSON) at:  cloudcart/grafana-cloud/alloy
# NOTE: the path MUST start with "cloudcart/" - the ESO IAM policy in
# terraform/modules/iam/eks-eso-iam.tf only allows secret:cloudcart/*.
#   {
#     "prom_username": "<Grafana Cloud metrics instance ID>",
#     "loki_username": "<Grafana Cloud logs instance ID>",
#     "token":         "<access policy token: metrics:write + logs:write>"
#   }
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: grafana-cloud-credentials
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-backend
    kind: ClusterSecretStore
  target:
    name: grafana-cloud-credentials
    creationPolicy: Owner
  data:
    - secretKey: prom-username
      remoteRef:
        key: cloudcart/grafana-cloud/alloy
        property: prom_username
    - secretKey: loki-username
      remoteRef:
        key: cloudcart/grafana-cloud/alloy
        property: loki_username
    - secretKey: token
      remoteRef:
        key: cloudcart/grafana-cloud/alloy
        property: token
