apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: grafana-cloud-secret
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-backend
    kind: ClusterSecretStore
  target:
    name: alloy-credentials
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: monitoring-eks/grafana-cloud/alloy
        property: username
    - secretKey: password
      remoteRef:
        key: monitoring-eks/grafana-cloud/alloy
        property: password