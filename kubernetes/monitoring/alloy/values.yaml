controller:
  type: daemonset

config:
  content: |
    // Discover Kubernetes pods running on the cluster nodes
    discovery.kubernetes "pods" {
      role = "pod"
    }

    // Forward discovered pod metrics to the remote_write component
    prometheus.scrape "cluster_metrics" {
      targets    = discovery.kubernetes.pods.targets
      forward_to = [prometheus.remote_write.grafana_cloud.receiver]
    }

    // Configure remote_write to push metrics securely to Grafana Cloud
    prometheus.remote_write "grafana_cloud" {
      endpoint {
        url = "https://prometheus-prod-us-central-0.grafana.net/api/prom/push"

        basic_auth {
          username = sys.env("GRAFANA_USER")
          password = sys.env("GRAFANA_PASSWORD")
        }
      }
    }

extraEnv:
  - name: GRAFANA_USER
    valueFrom:
      secretKeyRef:
        name: alloy-credentials
        key: username
  - name: GRAFANA_PASSWORD
    valueFrom:
      secretKeyRef:
        name: alloy-credentials
        key: password