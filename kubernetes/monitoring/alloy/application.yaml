apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana-alloy
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    notifications.argoproj.io/subscribe.on-sync-succeeded.slack: grafana-alloy
    notifications.argoproj.io/subscribe.on-sync-failed.slack: grafana-alloy
spec:
  project: default
  sources:
    - chart: alloy
      repoURL: https://grafana.github.io/helm-charts
      targetRevision: 0.1.0
      helm:
        valueFiles:
          - $values/kubernetes/monitoring/alloy/values.yaml
    
    - repoURL: https://github.com/mohitbnt/cloudcart-eks.git
      targetRevision: HEAD
      ref: values
      
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true